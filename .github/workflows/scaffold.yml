name: MVC scaffolds — Basic, Web Advanced, API JWT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring, intl
          tools: composer:v2
      - name: Smoke tests — all profiles
        run: |
          bash tests/smoke-local-cli.sh
          bash tests/smoke-basic.sh
          bash tests/smoke-advanced.sh
          bash tests/smoke-api-jwt.sh
      - name: Test basic dependencies
        run: |
          bash script.sh --name ci_basic --profile basic --no-install
          cd ci_basic
          composer install --no-interaction --prefer-dist
          php tests/form_request_test.php
          php tests/database_connection_test.php
      - name: Test Advanced Web DTO and CSRF middleware
        run: |
          bash script.sh --name ci_advanced --profile advanced --no-install
          cd ci_advanced
          composer install --no-interaction --prefer-dist
          for test in tests/*_test.php; do php "$test"; done
          php tests/security/reproduce_repository_leak.php
      - name: Test API JWT authentication, grants and routes
        run: |
          bash script.sh --name ci_api --profile api-jwt --no-install
          cd ci_api
          composer install --no-interaction --prefer-dist
          for test in tests/*_test.php; do php "$test"; done
          php tests/security/reproduce_repository_leak.php
